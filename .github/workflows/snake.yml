
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate blue snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: marloww10
          outputs: |
            dist/github-snake.svg?color_snake=#2563EB&color_dots=#EBF5FF,#BFDBFE,#93C5FD,#3B82F6,#1D4ED8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0D1117,#172554,#1D4ED8,#2563EB,#38BDF8

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
